     Colours: the app's theme variables only (dark and light). Every text coming from the store uses textContent. -->
<style>

  .chart { position: relative; height: 170px; margin: 6px 0 0; touch-action: pan-y; }

  .od b { font-weight: 600; }

  .tag { font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 999px; line-height: 17px; white-space: nowrap; }
  .tag.ok { color: var(--up); background: color-mix(in oklch, var(--up) 13%, transparent); }
  .tag.wait { color: var(--warning); background: color-mix(in oklch, var(--warning) 14%, transparent); }
  .tag.bad { color: var(--down); background: color-mix(in oklch, var(--down) 13%, transparent); }
  .tag.ship { color: var(--muted-foreground); background: var(--muted); }
  .empty { font-size: 12px; color: var(--muted-foreground); padding: 6px 0; }

  /* states */
  .note { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; padding: 8px 10px; border-radius: 10px;

  .setup { display: grid; gap: 10px; padding: 6px 2px; font-size: 12.5px; }

  .setup code { font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: 11.5px; padding: 1px 5px;

  .sk { border-radius: var(--r); background: var(--muted); animation: sk 1.4s ease-in-out infinite; }
  .sk.line { height: 12px; border-radius: 6px; margin: 4px 0 10px; }
  @keyframes sk { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .chart .draw { stroke-dashoffset: 0; }
  }
</style>

        }));
      const left = (X / W) * r.width, half = tip.offsetWidth / 2;
      tip.style.left = `${Math.max(half, Math.min(r.width - half, left))}px`;
      tip.style.top = `${Math.max(-6, (topY / H) * r.height - tip.offsetHeight - 12)}px`;
      tip.classList.add("on");
    };
    const hide = () => { tip.classList.remove("on"); cross.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); };
    el.onpointermove = (e) => show(e.clientX);
    el.onpointerdown = (e) => show(e.clientX);
    el.onpointerleave = hide;
    fit();
  }

  // ---------------------------------------------------------------- panels
  function ranked(title, ic, items, empty, label, sub) {
    const ul = h("ul", { class: "rows" });
    if (items === null) {
      for (let i = 0; i < 4; i++) ul.append(h("li", {}, h("div", { class: "sk line" })));
    } else {
      const max = Math.max(1, ...items.map((x) => x.s));
      items.forEach((x, i) => {
        const bar = h("span");
        ul.append(h("li", { class: "rk", title: label(x) },
          h("span", { class: "n", text: String(i + 1) }), h("span", { class: "t", text: label(x) }),
          h("span", { class: "s", text: money(x.s, true) }), h("div", { class: "bar" }, bar)));
        requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = `${Math.max(3, (x.s / max) * 100)}%`; }));
      });
    }
    return h("div", { class: "pn" }, h("h3", {}, icon(ic), title, sub ? h("small", { text: sub }) : null),
             items && !items.length ? h("div", { class: "empty", text: empty }) : ul);
  }
  function lastOrders() {
    const list = data().last || [], ul = h("ul", { class: "rows" });
    for (const o of list.slice(0, 5)) {
      const payK = o.canceled ? "canceled" : o.pay;
      const tone = o.canceled || /refund|void/.test(o.pay) ? "bad" : o.pay === "paid" ? "ok" : "wait";
      ul.append(h("li", { class: "od" }, h("b", { text: o.n }), h("span", { class: "s", text: money(o.total) }),
        h("span", { class: "m" }, h("span", { text: ago(Date.parse(o.at)) }),
          h("span", { class: `tag ${tone}`, text: L[payK] || payK.replace(/_/g, " ") }),
          !o.canceled && o.ship ? h("span", { class: "tag ship", text: L[o.ship] || o.ship.replace(/_/g, " ") }) : null)));
    }
    return h("div", { class: "pn" }, h("h3", {}, icon("receipt"), L.last), list.length ? ul : h("div", { class: "empty", text: L.noLast }));
  }
  function updatePanels() {
    const r = ranges(state.period), key = `${iso(r.a)}|${iso(r.b)}`, got = tops.get(key);
    const t = got && !(got instanceof Promise) ? got : null;
    const sub = L.p[state.period] + (t && t.partial ? ` · ${L.partial}` : "");
    const panels = [ranked(L.top, "trophy", t ? t.top : null, L.noTop, (x) => x.t, sub)];
    if (hasV() || (t && t.countries.length) || !t) panels.push(ranked(L.geo, "globe", t ? t.countries : null, L.noGeo, (x) => x.c, sub));
    panels.push(lastOrders());
    box.panels.replaceChildren(...panels);
    fit();
    if (!got) {
      const query = { from: iso(r.a), to: iso(r.b) };
      if (state.demo) query.demo = "1";
      const p = maxxing.api("top", { query })
        .then((res) => { tops.set(key, res && res.data ? res.data : { top: [], countries: [], partial: true }); })
        .catch(() => { tops.set(key, { top: [], countries: [], partial: true }); })
        .then(() => { const rr = ranges(state.period); if (`${iso(rr.a)}|${iso(rr.b)}` === key) updatePanels(); });
      tops.set(key, p);
    }
  }

  function updatePeriod() {
    updateChips();
    updateTiles(true);
    updateChart();
    updatePanels();
  }

  // ---------------------------------------------------------------- setup screen
  function setup(res) {
    const ol = h("ol");
    for (const step of L.setup) {
      // static strings of this file (no data): <code> tags are the only markup
      const li = h("li"); li.innerHTML = step; ol.append(li);
    }
    return h("div", { class: "setup" },
      h("div", { class: "hd" }, h("div", { class: "logo", title: "Shopify" }, shopifyLogo()), h("div", { class: "who" }, h("b", { text: L.setupTitle }))),
      res.error && res.error !== "missing_keys"
        ? h("div", { class: "note" }, icon("alert"), h("span", { text: `${L.err[res.error] || L.err.failed} ${res.message || ""}` })) : null,
      ol,
      h("div", {}, h("button", { type: "button", class: "ui-btn ui-sm", onclick: () => { state.demo = state.tried = true; load(true); } },
        icon("play"), L.demoBtn)));
  }

  function render() {
    const res = state.res;
    if (!res) return;
    lang = res.lang === "fr" ? "fr" : "en"; L = T[lang];
    document.documentElement.lang = lang;
    if (!res.ok || !res.data) { app.replaceChildren(setup(res)); return fit(); }
    currency = res.data.shop.currency || "USD";
    if (!available(state.period)) state.period = "30d";
    if (!hasV()) state.metrics = state.metrics.filter((k) => k !== "v" && k !== "conv");
    if (!state.metrics.length) state.metrics = ["s"];
    layout(res);
    updatePeriod();
  }

  // ---------------------------------------------------------------- sizing, loading
  let lastH = 0;
  function fit() {
    requestAnimationFrame(() => {
      const hgt = Math.ceil(app.getBoundingClientRect().height) + 6;
      if (Math.abs(hgt - lastH) > 2) { lastH = hgt; maxxing.resize(hgt); }
    });
  }
  let lastW = 0, rt = 0;
  new ResizeObserver(() => {
    const w = app.clientWidth;
    if (Math.abs(w - lastW) < 8) return fit();
    lastW = w; clearTimeout(rt);
    rt = setTimeout(() => { if (box.chart && state.res && state.res.ok) updateChart(); }, 120);
  }).observe(app);

  async function load(force) {
    if (state.loading) return;
    state.loading = true;
    if (box.refresh) box.refresh.classList.add("spin");
    const query = {};
    if (force) query.force = "1";
    if (state.demo) query.demo = "1";
    try {
      const res = await maxxing.api("stats", { query });
      if (res && res.demo !== state.demo) tops.clear();
      if (force) tops.clear();
      state.res = res;
      if (res && res.demo) state.demo = true;
    } catch (e) {
      state.res = state.res && state.res.data ? { ...state.res, error: "failed" }
                                             : { ok: false, lang, error: "failed", message: String(e.message || e) };
    } finally {
      state.loading = false;
      render();
    }
  }

  setInterval(() => {
    for (const el of app.querySelectorAll("[data-ago]")) el.textContent = L.updated(ago(Number(el.dataset.ago) * 1000));
  }, 30000);
  setInterval(() => { if (!document.hidden) load(false); }, REFRESH_MS);
  load(false);
})();
</script>
